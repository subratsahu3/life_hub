name: Build Android APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Life-Hub Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Production Assets
        working-directory: web
        run: npm run build

      - name: Sync Web Dist to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/dist
          cp -r web/dist android/app/src/main/assets/dist

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/life-hub-v1.0.apk
          ls -lh release-apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-hub-android-apk
          path: release-apks/life-hub-v1.0.apk
          retention-days: 60

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Life-Hub v1.0.0 — Production Android Release"
          body: |
            ## 🌟 Life-Hub — Unified Daily OS (Android APK Release)
            
            ### 📥 Download & Install
            Download **`life-hub-v1.0.apk`** below to install Life-Hub directly onto your Android smartphone or tablet!
            
            ### ✨ Features Included:
            - **📊 Life Command Center**: Holistic Daily Rhythm Score (0–100%) and AI Smart Daily Briefing.
            - **⏱️ Productivity & Focus**: Interactive Pomodoro focus timer with audio synthesizer chime, time-boxed planner, and habit streak tracker.
            - **⚡ Smart Living**: Appliance control grid, AC thermostat & brightness sliders, and automated eco-savings rules.
            - **🥗 Health & Wellness**: Calorie & macro split tracker, interactive 8-glass water counter, and guided workout routines.
            - **💰 Finances & Budgeting**: Income/expense cashflow ledger, proactive monthly category caps with overspend warnings.
            - **🤝 Neighborhood Mutual Aid**: Community bulletin board for borrowing tools, volunteering, and skill sharing with Karma points.
            - **📱 Universal Display Optimization**: Responsive mobile bottom navigation bar, notch protection, and smooth scrolling for any screen size.
          files: release-apks/life-hub-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
